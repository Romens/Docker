name: Build and Push Docker Image

on:
  push:
    branches:
      - main        # или master, если основная ветка называется master
  # Опционально: можно добавить запуск по расписанию или по тегам
  # schedule:
  #   - cron: '0 0 * * 0'  # раз в неделю

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./php.dockerfile   # указываем нестандартное имя Dockerfile
          push: true
          tags: romens/laravel:8.3
